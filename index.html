<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO Meta Tags -->
    <title>DevAnvil: Tech & Development Blogs</title>
    <meta name="description" content="DevAnvil is a modern blog for tech enthusiasts and developers. Explore insightful articles on web development, software engineering, programming languages, and more.">
    <meta name="keywords" content="tech blog, development blog, web development, software engineering, programming, javascript, python, coding">
    <link rel="canonical" href="https://devanvil.pages.dev/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://devanvil.pages.dev/">
    <meta property="og:title" content="DevAnvil: Tech & Development Blogs">
    <meta property="og:description" content="DevAnvil is a blog for tech enthusiasts and developers.">
    <meta property="og:image" content="https://devanvil.pages.dev/images/og-image.jpg">

    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://devanvil.pages.dev/">
    <meta property="twitter:title" content="DevAnvil: Tech & Development Blogs">
    <meta property="twitter:description" content="DevAnvil is a blog for tech enthusiasts and developers.">
    <meta property="twitter:image" content="https://devanvil.pages.dev/images/og-image.jpg">

    <link rel="stylesheet" href="/css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Google Fonts (Poppins & Roboto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <a href="/" class="nav-logo">DevAnvil</a>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="/blog" class="nav-link">Blogs</a>
                </li>
                <li class="nav-item">
                    <a href="/about" class="nav-link">About</a>
                </li>
                <li class="nav-item">
                    <a href="/contact" class="nav-link">Contact</a>
                </li>
            </ul>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                    <i class="fas fa-sun"></i>
                </button>
                <button class="hamburger" aria-label="Open menu" type="button">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <!-- Your blog posts and other main content will go here -->
        <!-- A clear H1 is crucial for SEO on each page -->
        <h1>Latest Articles on Tech & Development</h1>

        <div class="search-container">
            <form id="home-search-form">
                <input type="search" id="home-search-input" placeholder="Search all articles...">
            </form>
        </div>

        <section class="blog-posts">
            <div class="blog-posts-grid" id="latest-posts-grid">
                <!-- Blog posts will be loaded here by JavaScript -->
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-about">
                <a href="/" class="footer-logo">DevAnvil</a>
                <p class="footer-tagline">Forging the future of tech, one post at a time.</p>
            </div>
            <div class="footer-social">
                <a href="#" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="#" target="_blank" aria-label="X (Twitter)"><i class="fab fa-x-twitter"></i></a>
                <a href="#" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="/rss.xml" target="_blank" aria-label="RSS Feed"><i class="fas fa-rss"></i></a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; <span id="copyright-year"></span> DevAnvil. All Rights Reserved.</p>
        </div>
    </footer>
</body>
<script src="/js/main.js"></script>
</html>
