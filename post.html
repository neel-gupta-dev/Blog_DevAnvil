<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags will be updated by JavaScript -->
    <title>Loading Post - DevAnvil</title>
    <meta name="description" content="Loading post content...">
    <link rel="canonical" href="https://devanvil.pages.dev/post" />

    <!-- Open Graph / Facebook (Dynamic) -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://devanvil.pages.dev/post">
    <meta property="og:title" content="Loading Post - DevAnvil">
    <meta property="og:description" content="Loading post content...">
    <meta property="og:image" content="https://devanvil.pages.dev/images/og-image.jpg">

    <!-- X (Twitter) (Dynamic) -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://devanvil.pages.dev/post">
    <meta property="twitter:title" content="Loading Post - DevAnvil">
    <meta property="twitter:description" content="Loading post content...">
    <meta property="twitter:image" content="https://devanvil.pages.dev/images/og-image.jpg">

    <!-- Structured Data (for SEO) will be populated by JavaScript -->
    <script type="application/ld+json" id="post-schema"></script>

    <link rel="stylesheet" href="/css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Google Fonts (Poppins & Roboto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <a href="/" class="nav-logo">DevAnvil</a>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="/blog" class="nav-link">Blogs</a>
                </li>
                <li class="nav-item">
                    <a href="/about" class="nav-link">About</a>
                </li>
                <li class="nav-item">
                    <a href="/contact" class="nav-link">Contact</a>
                </li>
            </ul>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                    <i class="fas fa-sun"></i>
                </button>
                <div class="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <article class="post-full">
            <header class="post-full-header">
                <span id="post-category" class="card-category"></span>
                <h1 id="post-title" class="post-full-title">Loading post...</h1>
                <div id="post-meta" class="post-full-meta">
                    <!-- Meta info will be injected here -->
                </div>
            </header>

            <figure id="post-image-container" class="post-full-image">
                <!-- Image will be injected here -->
            </figure>

            <section id="post-content" class="post-full-content">
                <!-- Post content will be injected here -->
            </section>
        </article>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-about">
                <a href="/" class="footer-logo">DevAnvil</a>
                <p class="footer-tagline">Forging the future of tech, one post at a time.</p>
            </div>
            <div class="footer-social">
                <a href="#" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="#" target="_blank" aria-label="X (Twitter)"><i class="fab fa-x-twitter"></i></a>
                <a href="#" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="/rss.xml" target="_blank" aria-label="RSS Feed"><i class="fas fa-rss"></i></a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; <span id="copyright-year">2024</span> DevAnvil. All Rights Reserved.</p>
        </div>
    </footer>
</body>
<script src="/js/main.js"></script>
</html>
